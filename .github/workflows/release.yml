name: Release

# Push a tag like v2.0 (matching version= in unbound/module.info) to run the
# tests, build the package and publish the GitHub release with both files.
# Or run it by hand from the Actions tab on main, giving the version: it then
# also creates the annotated tag on the commit it tested. (A tag pushed with
# the workflow's own token would not start this workflow again.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, as in unbound/module.info (e.g. 2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches module.info
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ver=$(sed -n 's/^version=//p' unbound/module.info)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "run it on main, not $GITHUB_REF"; exit 1; }
            [ "$INPUT_VERSION" = "$ver" ] || { echo "asked for $INPUT_VERSION but module.info says $ver"; exit 1; }
            tag="v$ver"
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null \
              && { echo "tag $tag already exists"; exit 1; }
          else
            tag="$GITHUB_REF_NAME"
            [ "v$ver" = "$tag" ] || { echo "tag $tag but module.info says $ver"; exit 1; }
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Install Unbound (for unbound-checkconf)
        run: sudo apt-get update -q && sudo apt-get install -y -q unbound
      - name: Install Webmin sources and this module
        run: sudo sh .github/scripts/setup-webmin.sh
      - name: Perl syntax check
        run: sudo sh .github/scripts/syntax-check.sh
      - name: Tests
        run: sudo sh tests/run.sh
      - name: Build package
        run: |
          sh make-package.sh
          cp unbound.wbm.gz "unbound-$VER.wbm.gz"
          echo "SUM=$(sha256sum unbound.wbm.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Create the tag (manual run only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$GITHUB_SHA" -m "Release $VER"
          git push origin "refs/tags/$TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh .github/scripts/release-notes.sh "$VER" "$SUM" > notes.md
          gh release create "$TAG" unbound.wbm.gz "unbound-$VER.wbm.gz" \
            --title "webmin-unbound $VER" --notes-file notes.md --latest
